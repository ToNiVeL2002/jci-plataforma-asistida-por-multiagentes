# ============================================================
# NGINX — Configuración de Producción (FASE 2 - HTTPS Activo)
# Dominio: luci.enkaigroup.com
# ============================================================

# ============================================================
# SERVIDOR HTTP (Puerto 80)
# - Sirve el webroot challenge de Certbot para renovaciones
# - Redirige todo el tráfico HTTP automáticamente a HTTPS (443)
# ============================================================
server {
    listen 80;
    server_name luci.enkaigroup.com;

    # Ruta para los desafíos de validación de Certbot (Let's Encrypt HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección automática a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# SERVIDOR HTTPS (Puerto 443) — FASE 2 ACTIVA
# Usando los certificados SSL generados por Certbot
# ============================================================
server {
    listen 443 ssl;
    server_name luci.enkaigroup.com;

    # Certificados SSL de Let's Encrypt (montados por volumen)
    ssl_certificate /etc/letsencrypt/live/luci.enkaigroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luci.enkaigroup.com/privkey.pem;

    # Configuraciones de seguridad SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad recomendados
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Caché de assets estáticos de Vite (con hash en el nombre)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy Reverso hacia el backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Fallback SPA — todas las rutas que no existen van al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
