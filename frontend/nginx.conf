# ============================================================
# NGINX — Configuración de Producción
# Dominio: luci.enkaigroup.com
#
# FASE 1 (Despliegue inicial): El bloque del puerto 443 está
# comentado para poder levantar Nginx y ejecutar Certbot en el
# puerto 80 sin errores por certificados inexistentes.
#
# FASE 2 (Después de correr Certbot): Descomentar el bloque 443
# y cambiar el bloque 80 para que solo haga redirección HTTPS.
# Luego recargar: docker compose -f docker-compose.prod.yml exec frontend nginx -s reload
# ============================================================

# ============================================================
# SERVIDOR HTTP (Puerto 80)
# - Sirve el webroot challenge de Certbot para la validación TLS
# - Redirige TODO el tráfico restante a HTTPS una vez que
#   el bloque 443 esté activo y los certificados existan
# ============================================================
server {
    listen 80;
    server_name luci.enkaigroup.com;

    # Ruta para los desafíos de validación de Certbot (Let's Encrypt HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------
    # FASE 1: Servir la app directamente por HTTP mientras
    # no hay certificado SSL. Comentar estas líneas en FASE 2.
    # ---------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy Reverso hacia el backend en producción (HTTP)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------
    # FASE 2: Reemplazar todo lo de arriba (root, gzip, locations)
    # por esta única línea de redirección a HTTPS:
    # location / { return 301 https://$host$request_uri; }
    # ---------------------------------------------------------
}


